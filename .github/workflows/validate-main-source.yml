
name: Validate PR source for main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  pull-requests: write
  issues: write

jobs:
  validate-main-source:
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        if: github.head_ref != 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MESSAGE="PR rechazado automáticamente: la rama de origen debe ser dev para integrar cambios en main. Cierre este PR y cree uno nuevo desde dev."

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "$MESSAGE"

          gh pr close "$PR_NUMBER" \
            --repo "$REPO" \
            --comment "$MESSAGE"

          echo "::error::Only pull requests from dev can be merged into main."
          exit 1

      - name: Source branch accepted
        if: github.head_ref == 'dev'
        run: echo "Valid source branch: dev"
