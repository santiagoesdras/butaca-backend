name: Validate main source branch

on:
  pull_request:
    branches:
      - main
    
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

    permissions:
      contents: read

    jobs:
      validate-source:
        name: validate-main-source
        runs-on: ubuntu-latest

        steps:
          - name: Verify source branch
              env:
                SOURCE_BRANCH: ${{ github.head_ref }}
              run: |
                if [ "$SOURCE_BRANCH" != "dev" ]; then
                  echo "::error::Only pull requests from dev can be merged into main."
                  echo "::error::Source branch: $SOURCE_BRANCH"
                  exit 1
                fi

                echo "Valid source branch: dev"
